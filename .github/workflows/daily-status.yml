name: Update daily status Excel
on:
  issues:
    types: [opened]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-status-excel
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Daily Status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - name: Collect open entries
        run: |
          gh issue list --state open --limit 100 --json number,title,body \
            --jq '[.[] | select(.title | startswith("[Daily Status]"))] | sort_by(.number)' > issues.json
      - name: Update Excel
        run: python .github/scripts/update_excel.py
      - name: Commit and push
        run: |
          git config user.name "daily-status-bot"
          git config user.email "daily-status-bot@users.noreply.github.com"
          git add daily_status.xlsx
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Daily status update (run ${GITHUB_RUN_ID})"
            git push
          fi
      - name: Reply and close entries
        run: |
          jq -c '.[]' results.json | while read -r r; do
            n=$(jq -r .number <<<"$r"); m=$(jq -r .message <<<"$r")
            gh issue comment "$n" --body "$m"
            gh issue close "$n"
          done
